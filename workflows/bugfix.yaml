# Bug fix: reproduce first, then fix. The regression tests are written before any code changes and
# must FAIL on the current code (regression_reproduces); the fix may not touch them and must make
# the whole suite pass. Release prepares a patch release for a human sign-off.
#
#   requirements ─► impact ─► reproduce ─► fix ─► release
#     (approve)    (approve)  [new tests    [full suite   [entry: full suite]
#                              fail, rest    passes]       (approve)
#                              pass]
name: bugfix
version: "1"
description: Bug report -> spec -> root cause -> failing regression test -> fix -> patch release

selection:                           # how `orch run auto` decides this workflow fits
  codebase: existing
  use_when: >-
    A defect in the existing service: something that should work does not, or behaves differently from what was specified or expected (a bug report, observed vs expected behaviour). The bug is reproduced with a failing test before it is fixed.

stages:
  - id: requirements
    agent: analyst
    exit_gates:
      - name: outputs_present          # a narrow bug may have no non-functional requirements
        args: { keys: [goal, functional] }
      - ambiguities_resolved
    retry: { max_attempts: 2 }       # a structural miss gets one more attempt, with the gate's feedback
    clarification: { max_rounds: 3 }
    approval: required
    max_revisions: 2

  - id: impact
    agent: impact_analyst
    needs: [requirements]
    description: Root cause in the code, the fix, its risks, and how to prove it
    read_scope: ["url-shortener/pom.xml", "url-shortener/src/**"]
    downstream_context: true
    exit_gates:
      - name: outputs_present
        args: { keys: [impacted, risks, test_strategy] }
    approval: required
    max_revisions: 2

  - id: reproduce
    agent: reproducer
    needs: [impact]
    description: Regression tests that fail on the current code because of the bug
    read_scope: ["url-shortener/pom.xml", "url-shortener/src/main/**", "url-shortener/src/test/**"]
    write_scope: ["url-shortener/src/test/**"]
    exit_gates:
      - name: regression_reproduces
        args: { project: url-shortener, timeout_seconds: 900 }
    retry: { max_attempts: 3, backoff_seconds: 1 }

  - id: fix
    agent: coder
    needs: [reproduce]
    read_scope: ["url-shortener/pom.xml", "url-shortener/src/main/**", "url-shortener/src/test/**"]
    write_scope: ["url-shortener/pom.xml", "url-shortener/src/main/**"]
    exit_gates:
      - name: maven_test
        # 138 tests before this workflow was introduced, plus at least one regression test
        args: { project: url-shortener, timeout_seconds: 900, min_tests: 139 }
      - name: openapi_conformance
        args: { spec: url-shortener/openapi.yaml, source: url-shortener/src/main/java }
      - name: coverage
        args: { project: url-shortener, min_line: 85, min_changed_line: 80, exclude: ["*Application.java"] }
    retry: { max_attempts: 3, backoff_seconds: 1 }

  - id: release
    agent: release
    needs: [fix]
    read_scope: ["url-shortener/CHANGELOG.md"]
    write_scope: ["url-shortener/CHANGELOG.md", "url-shortener/docs/releases/**"]
    gate_context: true               # judge readiness on the orchestrator's gate results, not agents' claims
    entry_gates:
      - name: maven_test
        args: { project: url-shortener, timeout_seconds: 900, min_tests: 139 }
      - name: service_smoke            # the packaged jar, started for real and exercised over HTTP
        args:
          project: url-shortener
          steps:
            - {name: management health, port: management, path: /actuator/health, expect: 200, expect_json: {status: UP}}
            - {name: create, method: POST, path: /api/links, json: {url: "https://203.0.113.10/smoke?q=1"}, expect: 201, save: {code: code, token: managementToken}}
            - {name: redirect, path: "/{code}", expect: 302, expect_headers: {Location: "https://203.0.113.10/smoke?q=1", Cache-Control: no-store, X-Content-Type-Options: nosniff}}
            - {name: metadata, path: "/api/links/{code}", expect: 200, expect_json: {originalUrl: "https://203.0.113.10/smoke?q=1"}}
            - {name: stats count the redirect, path: "/api/links/{code}/stats", headers: {X-Management-Token: "{token}"}, expect: 200, expect_json: {totalClicks: 1}}
            - {name: wrong token, method: PATCH, path: "/api/links/{code}", headers: {X-Management-Token: wrong}, json: {expiresAt: null}, expect: 403, expect_json: {error: invalid_token}}
            - {name: remove expiry, method: PATCH, path: "/api/links/{code}", headers: {X-Management-Token: "{token}"}, json: {expiresAt: null}, expect: 200}
            - {name: prohibited destination, method: POST, path: /api/links, json: {url: "https://ｌｏｃａｌｈｏｓｔ/"}, expect: 400, expect_json: {error: prohibited_destination}}
            - {name: malformed JSON, method: POST, path: /api/links, json: '{"url":', expect: 400, expect_json: {error: invalid_request}}
            - {name: wrong media type, method: POST, path: /api/links, json: x, headers: {Content-Type: text/plain}, expect: 415, expect_json: {error: unsupported_media_type}}
            - {name: wrong method, method: PUT, path: /api/links, expect: 405, expect_json: {error: method_not_allowed}}
            - {name: unknown path, path: /no/such/path, expect: 404, expect_json: {error: not_found}}
            - {name: delete, method: DELETE, path: "/api/links/{code}", headers: {X-Management-Token: "{token}"}, expect: 204}
            - {name: deleted link, path: "/{code}", expect: 404, expect_json: {error: not_found}}
    exit_gates:
      - name: release_checklist_passed
      - name: files_exist
        args: { paths: [url-shortener/CHANGELOG.md] }
    approval: required
